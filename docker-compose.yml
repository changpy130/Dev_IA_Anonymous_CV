# ============================================================================
#  Stack « Pipeline CV anonymisés » — n8n + Gotenberg (100 % gratuit)
# ----------------------------------------------------------------------------
#  Démarrer :  docker compose up -d     → ouvrir http://localhost:5678
#  Arrêter  :  docker compose down       (vos workflows restent dans le volume)
#  Logs     :  docker compose logs -f n8n
# ============================================================================
name: pipeline-cv

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.47.7   # version figée = même comportement pour tout le monde
    container_name: pipeline-cv-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=Europe/Paris
      - TZ=Europe/Paris
      - N8N_HOST=localhost
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - N8N_SECURE_COOKIE=false            # accès en http local
      - N8N_RESTRICT_FILE_ACCESS_TO=/files # n8n ne lit/écrit QUE dans le dossier ./sorties
      - N8N_DIAGNOSTICS_ENABLED=false      # pas de télémétrie
      - N8N_PERSONALIZATION_ENABLED=false
    volumes:
      - n8n_data:/home/node/.n8n           # workflows, identifiants, historique
      - ./sorties:/files                   # registre Excel + CV anonymisés (visibles sur votre PC)
    extra_hosts:
      - "host.docker.internal:host-gateway" # option : joindre Ollama installé sur votre PC
    depends_on:
      - gotenberg

  gotenberg:
    image: gotenberg/gotenberg:8            # convertisseur HTML → PDF (et DOCX → PDF)
    container_name: pipeline-cv-gotenberg
    restart: unless-stopped
    # Joignable depuis n8n à l'adresse http://gotenberg:3000 (aucun port à ouvrir)

volumes:
  n8n_data:
